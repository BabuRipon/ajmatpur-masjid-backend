AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Express Api with automatic deployment

Resources:
  ExpressFunction:
    type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: handler.handler
      Runtime: nodejs22.x
      timeout: 10
      MemorySize: 128
      FunctionUrlConfig:
        AuthType: None

Outputs:
  ApiUri:
    Description: Express Api Url
    Value: !GetAtt ExpressFunctionUrl.FunctionUrl
