AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Express API with automatic deployment

Resources:
  ExpressFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: handler.handler
      Runtime: nodejs22.x
      Timeout: 10
      MemorySize: 128
      FunctionUrlConfig:
        AuthType: NONE

Outputs:
  ApiUri:
    Description: Express API URL
    Value: !GetAtt ExpressFunctionUrl.FunctionUrl